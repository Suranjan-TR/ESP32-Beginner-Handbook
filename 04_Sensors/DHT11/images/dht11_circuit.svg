<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 340" width="860" height="340"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#111}.t{font-size:18px;font-weight:bold}.s{font-size:13px}.b{font-size:14px;font-weight:bold}</style><rect width="860" height="340" fill="#fff"/><text x="430.0" y="28" class="t" text-anchor="middle">DHT11 WIRING (DATA on GPIO4)</text><rect x="30" y="50" width="180" height="250" rx="8" fill="#e8f5e9" stroke="#333" stroke-width="3"/><text x="120" y="42" class="b" text-anchor="middle">ESP32 DevKit (38-pin)</text><text x="200" y="85" class="b" text-anchor="end">3V3</text><circle cx="210" cy="80" r="5" fill="#212121"/><text x="200" y="185" class="b" text-anchor="end">GPIO4</text><circle cx="210" cy="180" r="5" fill="#212121"/><text x="200" y="265" class="b" text-anchor="end">GND</text><circle cx="210" cy="260" r="5" fill="#212121"/><rect x="620" y="60" width="180" height="230" rx="8" fill="#e3f2fd" stroke="#333" stroke-width="3"/><text x="710.0" y="52" class="b" text-anchor="middle">DHT11 module</text><text x="710.0" y="280" class="s" text-anchor="middle">3-pin module</text><text x="630" y="85" class="b" text-anchor="start">VCC (+)</text><circle cx="620" cy="80" r="5" fill="#212121"/><text x="630" y="185" class="b" text-anchor="start">DATA (OUT)</text><circle cx="620" cy="180" r="5" fill="#212121"/><text x="630" y="265" class="b" text-anchor="start">GND (−)</text><circle cx="620" cy="260" r="5" fill="#212121"/><polyline points="210,80 620,80" fill="none" stroke="#d32f2f" stroke-width="3"/><polyline points="210,180 620,180" fill="none" stroke="#1565c0" stroke-width="3"/><polyline points="210,260 620,260" fill="none" stroke="#212121" stroke-width="3"/><circle cx="440" cy="80" r="5" fill="#d32f2f"/><polyline points="440,80 440,88" fill="none" stroke="#d32f2f" stroke-width="3"/><rect x="426" y="96" width="28" height="68" rx="0" fill="#ffe0b2" stroke="#333" stroke-width="2"/><text x="440" y="135" class="s" text-anchor="middle">10 kΩ</text><polyline points="440,164 440,180" fill="none" stroke="#1565c0" stroke-width="3"/><circle cx="440" cy="180" r="5" fill="#1565c0"/><text x="540" y="128" class="s" text-anchor="start">pull-up (bare 4-pin sensor only)</text><text x="430" y="320" class="s" text-anchor="middle">3-pin modules usually already contain the pull-up. Bare DHT11 (4 pins): VCC, DATA, NC (unused), GND.</text><text x="430.0" y="328" class="s" text-anchor="middle" style="fill:#c62828">Pin numbers are for the ESP32 DevKit 38-pin (ESP32-WROOM-32). Verify against YOUR board's pinout.</text></svg>