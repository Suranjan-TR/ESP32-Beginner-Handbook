<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" width="860" height="380"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#111}.t{font-size:18px;font-weight:bold}.s{font-size:13px}.b{font-size:14px;font-weight:bold}</style><rect width="860" height="380" fill="#fff"/><text x="430.0" y="28" class="t" text-anchor="middle">FLAME SENSOR WIRING (powered at 3.3 V)</text><rect x="30" y="50" width="180" height="290" rx="8" fill="#e8f5e9" stroke="#333" stroke-width="3"/><text x="120" y="42" class="b" text-anchor="middle">ESP32 DevKit (38-pin)</text><text x="200" y="85" class="b" text-anchor="end">3V3</text><circle cx="210" cy="80" r="5" fill="#212121"/><text x="200" y="155" class="b" text-anchor="end">GPIO32</text><circle cx="210" cy="150" r="5" fill="#212121"/><text x="200" y="215" class="b" text-anchor="end">GPIO33</text><circle cx="210" cy="210" r="5" fill="#212121"/><text x="200" y="295" class="b" text-anchor="end">GND</text><circle cx="210" cy="290" r="5" fill="#212121"/><rect x="620" y="60" width="200" height="260" rx="8" fill="#e3f2fd" stroke="#333" stroke-width="3"/><text x="720.0" y="52" class="b" text-anchor="middle">Flame sensor module</text><text x="720.0" y="310" class="s" text-anchor="middle">IR detector + LM393</text><text x="630" y="85" class="b" text-anchor="start">VCC</text><circle cx="620" cy="80" r="5" fill="#212121"/><text x="630" y="155" class="b" text-anchor="start">DO</text><circle cx="620" cy="150" r="5" fill="#212121"/><text x="630" y="215" class="b" text-anchor="start">AO</text><circle cx="620" cy="210" r="5" fill="#212121"/><text x="630" y="295" class="b" text-anchor="start">GND</text><circle cx="620" cy="290" r="5" fill="#212121"/><polyline points="210,80 620,80" fill="none" stroke="#d32f2f" stroke-width="3"/><polyline points="620,150 212,150" fill="none" stroke="#1565c0" stroke-width="3" marker-end="url(#a)"/><polyline points="620,210 212,210" fill="none" stroke="#1565c0" stroke-width="3" marker-end="url(#a)"/><polyline points="210,290 620,290" fill="none" stroke="#212121" stroke-width="3"/><text x="420" y="142" class="s" text-anchor="middle">DO: digital HIGH/LOW</text><text x="420" y="202" class="s" text-anchor="middle">AO: analog level (ADC1)</text><text x="430" y="350" class="s" text-anchor="middle">Powering at 3.3 V keeps DO and AO at 3.3 V or less. Many modules: DO = LOW when flame is detected — VERIFY yours.</text><text x="430.0" y="368" class="s" text-anchor="middle" style="fill:#c62828">Pin numbers are for the ESP32 DevKit 38-pin (ESP32-WROOM-32). Verify against YOUR board's pinout.</text></svg>