<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 340" width="860" height="340"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#111}.t{font-size:18px;font-weight:bold}.s{font-size:13px}.b{font-size:14px;font-weight:bold}</style><rect width="860" height="340" fill="#fff"/><text x="430.0" y="28" class="t" text-anchor="middle">HC-SR04 — HOW IT WORKS</text><rect x="30" y="90" width="140" height="120" rx="8" fill="#e8f5e9" stroke="#333" stroke-width="3"/><text x="100" y="145" class="b" text-anchor="middle">ESP32</text><text x="100" y="165" class="s" text-anchor="middle">GPIO18 = TRIG</text><text x="100" y="182" class="s" text-anchor="middle">GPIO19 = ECHO</text><rect x="330" y="90" width="170" height="120" rx="8" fill="#e3f2fd" stroke="#333" stroke-width="3"/><text x="415" y="80" class="b" text-anchor="middle">HC-SR04</text><rect x="345" y="120" width="60" height="60" rx="30" fill="#fff" stroke="#333" stroke-width="2"/><text x="375" y="155" class="b" text-anchor="middle">T</text><rect x="425" y="120" width="60" height="60" rx="30" fill="#fff" stroke="#333" stroke-width="2"/><text x="455" y="155" class="b" text-anchor="middle">R</text><text x="375" y="200" class="s" text-anchor="middle">transmitter</text><text x="455" y="200" class="s" text-anchor="middle">receiver</text><rect x="740" y="70" width="24" height="160" rx="0" fill="#ffcc80" stroke="#333" stroke-width="2"/><text x="752" y="255" class="b" text-anchor="middle">Object</text><polyline points="172,112 328,112" fill="none" stroke="#1565c0" stroke-width="3" marker-end="url(#a)"/><text x="250" y="100" class="s" text-anchor="middle">1. TRIG: 10 µs pulse</text><polyline points="502,112 738,112" fill="none" stroke="#2e7d32" stroke-width="3" marker-end="url(#a)"/><text x="620" y="102" class="s" text-anchor="middle">2. 8 bursts of 40 kHz ultrasound</text><polyline points="738,190 502,190" fill="none" stroke="#2e7d32" stroke-width="3" marker-end="url(#a)"/><text x="620" y="210" class="s" text-anchor="middle">3. Sound reflects back (echo)</text><polyline points="328,190 172,190" fill="none" stroke="#1565c0" stroke-width="3" marker-end="url(#a)"/><text x="250" y="208" class="s" text-anchor="middle">4. ECHO: HIGH for the</text><text x="250" y="224" class="s" text-anchor="middle">round-trip time</text><text x="430" y="290" class="s" text-anchor="middle">Distance (cm) = time (µs) × 0.0343 ÷ 2      (÷ 2 because sound travels there AND back)</text><text x="430.0" y="328" class="s" text-anchor="middle" style="fill:#c62828">Speed of sound ≈ 343 m/s at 20 °C = 0.0343 cm/µs</text></svg>