<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" width="860" height="420"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#111}.t{font-size:18px;font-weight:bold}.s{font-size:13px}.b{font-size:14px;font-weight:bold}</style><rect width="860" height="420" fill="#fff"/><text x="430.0" y="28" class="t" text-anchor="middle">HC-SR04 WIRING (ECHO through a voltage divider)</text><rect x="30" y="50" width="180" height="345" rx="8" fill="#e8f5e9" stroke="#333" stroke-width="3"/><text x="120" y="42" class="b" text-anchor="middle">ESP32 DevKit (38-pin)</text><text x="200" y="85" class="b" text-anchor="end">VIN (5V)</text><circle cx="210" cy="80" r="5" fill="#212121"/><text x="200" y="155" class="b" text-anchor="end">GPIO18</text><circle cx="210" cy="150" r="5" fill="#212121"/><text x="200" y="215" class="b" text-anchor="end">GPIO19</text><circle cx="210" cy="210" r="5" fill="#212121"/><text x="200" y="325" class="b" text-anchor="end">GND</text><circle cx="210" cy="320" r="5" fill="#212121"/><rect x="620" y="60" width="180" height="290" rx="8" fill="#e3f2fd" stroke="#333" stroke-width="3"/><text x="710.0" y="52" class="b" text-anchor="middle">HC-SR04</text><text x="710.0" y="340" class="s" text-anchor="middle">(5 V module)</text><text x="630" y="85" class="b" text-anchor="start">VCC</text><circle cx="620" cy="80" r="5" fill="#212121"/><text x="630" y="155" class="b" text-anchor="start">TRIG</text><circle cx="620" cy="150" r="5" fill="#212121"/><text x="630" y="215" class="b" text-anchor="start">ECHO</text><circle cx="620" cy="210" r="5" fill="#212121"/><text x="630" y="325" class="b" text-anchor="start">GND</text><circle cx="620" cy="320" r="5" fill="#212121"/><polyline points="210,80 620,80" fill="none" stroke="#d32f2f" stroke-width="3"/><polyline points="210,150 620,150" fill="none" stroke="#1565c0" stroke-width="3" marker-end="url(#a)"/><text x="420" y="142" class="s" text-anchor="middle">TRIG (3.3 V output is enough)</text><polyline points="620,210 400,210" fill="none" stroke="#1565c0" stroke-width="3"/><rect x="486" y="198" width="68" height="24" rx="0" fill="#ffe0b2" stroke="#333" stroke-width="2"/><text x="520" y="215" class="b" text-anchor="middle">1 kΩ</text><circle cx="400" cy="210" r="5" fill="#212121"/><polyline points="400,210 212,210" fill="none" stroke="#1565c0" stroke-width="3" marker-end="url(#a)"/><text x="300" y="202" class="s" text-anchor="middle">≈3.3 V</text><polyline points="400,210 400,248" fill="none" stroke="#1565c0" stroke-width="3"/><rect x="386" y="248" width="28" height="68" rx="0" fill="#ffe0b2" stroke="#333" stroke-width="2"/><text x="400" y="287" class="s" text-anchor="middle">2 kΩ</text><polyline points="400,316 400,320" fill="none" stroke="#212121" stroke-width="3"/><polyline points="620,320 212,320" fill="none" stroke="#212121" stroke-width="3"/><circle cx="400" cy="320" r="5" fill="#212121"/><text x="520" y="190" class="s" text-anchor="middle">ECHO = 5 V pulse</text><text x="330" y="338" class="s" text-anchor="middle">GND</text><text x="430" y="376" class="s" text-anchor="middle">Divider: 5 V × 2 kΩ / (1 kΩ + 2 kΩ) = 3.33 V   (2 kΩ = two 1 kΩ resistors in series)</text><text x="430.0" y="408" class="s" text-anchor="middle" style="fill:#c62828">Pin numbers are for the ESP32 DevKit 38-pin (ESP32-WROOM-32). Verify against YOUR board's pinout.</text></svg>