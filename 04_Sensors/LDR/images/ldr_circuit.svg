<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 415" width="860" height="415"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#111}.t{font-size:18px;font-weight:bold}.s{font-size:13px}.b{font-size:14px;font-weight:bold}</style><rect width="860" height="415" fill="#fff"/><text x="430.0" y="28" class="t" text-anchor="middle">LDR VOLTAGE DIVIDER (GPIO34 = ADC1 input)</text><rect x="30" y="50" width="180" height="330" rx="8" fill="#e8f5e9" stroke="#333" stroke-width="3"/><text x="120" y="42" class="b" text-anchor="middle">ESP32 DevKit (38-pin)</text><text x="200" y="85" class="b" text-anchor="end">3V3</text><circle cx="210" cy="80" r="5" fill="#212121"/><text x="200" y="205" class="b" text-anchor="end">GPIO34</text><circle cx="210" cy="200" r="5" fill="#212121"/><text x="200" y="335" class="b" text-anchor="end">GND</text><circle cx="210" cy="330" r="5" fill="#212121"/><polyline points="210,80 450,80 450,106" fill="none" stroke="#d32f2f" stroke-width="3"/><rect x="436" y="106" width="28" height="68" rx="0" fill="#fff59d" stroke="#333" stroke-width="2"/><text x="450" y="145" class="s" text-anchor="middle">LDR</text><polyline points="450,174 450,246" fill="none" stroke="#212121" stroke-width="3"/><circle cx="450" cy="200" r="5" fill="#212121"/><polyline points="450,200 212,200" fill="none" stroke="#1565c0" stroke-width="3" marker-end="url(#a)"/><rect x="436" y="246" width="28" height="68" rx="0" fill="#ffe0b2" stroke="#333" stroke-width="2"/><text x="450" y="285" class="s" text-anchor="middle">10 kΩ</text><polyline points="450,314 450,330 212,330" fill="none" stroke="#212121" stroke-width="3"/><circle cx="450" cy="330" r="5" fill="#212121"/><text x="330" y="72" class="s" text-anchor="middle">3.3 V</text><text x="330" y="192" class="s" text-anchor="middle">Vout (analog voltage)</text><text x="330" y="322" class="s" text-anchor="middle">GND</text><text x="680" y="110" class="s" text-anchor="middle">Vout = 3.3 V × 10 kΩ / (R_LDR + 10 kΩ)</text><text x="680" y="140" class="s" text-anchor="middle">More light → R_LDR decreases</text><text x="680" y="160" class="s" text-anchor="middle">→ Vout increases → ADC value increases</text><text x="680" y="200" class="s" text-anchor="middle">Dark → R_LDR increases → Vout decreases</text><text x="680" y="220" class="s" text-anchor="middle">→ ADC value decreases</text><text x="680" y="270" class="s" text-anchor="middle">ADC range: 0 (0 V) to 4095 (~3.3 V)</text><text x="430.0" y="403" class="s" text-anchor="middle" style="fill:#c62828">Pin numbers are for the ESP32 DevKit 38-pin (ESP32-WROOM-32). Verify against YOUR board's pinout.</text></svg>