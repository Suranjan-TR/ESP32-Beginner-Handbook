<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" width="860" height="420"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#111}.t{font-size:18px;font-weight:bold}.s{font-size:13px}.b{font-size:14px;font-weight:bold}</style><rect width="860" height="420" fill="#fff"/><text x="430.0" y="28" class="t" text-anchor="middle">MQ-2 WIRING (AO through a voltage divider)</text><rect x="30" y="50" width="180" height="345" rx="8" fill="#e8f5e9" stroke="#333" stroke-width="3"/><text x="120" y="42" class="b" text-anchor="middle">ESP32 DevKit (38-pin)</text><text x="200" y="85" class="b" text-anchor="end">VIN (5V)</text><circle cx="210" cy="80" r="5" fill="#212121"/><text x="200" y="175" class="b" text-anchor="end">GPIO35</text><circle cx="210" cy="170" r="5" fill="#212121"/><text x="200" y="335" class="b" text-anchor="end">GND</text><circle cx="210" cy="330" r="5" fill="#212121"/><rect x="620" y="60" width="180" height="300" rx="8" fill="#e3f2fd" stroke="#333" stroke-width="3"/><text x="710.0" y="52" class="b" text-anchor="middle">MQ-2 module</text><text x="710.0" y="350" class="s" text-anchor="middle">needs 5 V heater</text><text x="630" y="85" class="b" text-anchor="start">VCC</text><circle cx="620" cy="80" r="5" fill="#212121"/><text x="630" y="175" class="b" text-anchor="start">AO</text><circle cx="620" cy="170" r="5" fill="#212121"/><text x="630" y="255" class="b" text-anchor="start">DO</text><circle cx="620" cy="250" r="5" fill="#212121"/><text x="630" y="335" class="b" text-anchor="start">GND</text><circle cx="620" cy="330" r="5" fill="#212121"/><polyline points="210,80 620,80" fill="none" stroke="#d32f2f" stroke-width="3"/><polyline points="620,170 400,170" fill="none" stroke="#1565c0" stroke-width="3"/><rect x="486" y="158" width="68" height="24" rx="0" fill="#ffe0b2" stroke="#333" stroke-width="2"/><text x="520" y="175" class="b" text-anchor="middle">10 kΩ</text><circle cx="400" cy="170" r="5" fill="#212121"/><polyline points="400,170 212,170" fill="none" stroke="#1565c0" stroke-width="3" marker-end="url(#a)"/><text x="300" y="162" class="s" text-anchor="middle">≈3.3 V max</text><polyline points="400,170 400,216" fill="none" stroke="#1565c0" stroke-width="3"/><rect x="386" y="216" width="28" height="68" rx="0" fill="#ffe0b2" stroke="#333" stroke-width="2"/><text x="400" y="255" class="s" text-anchor="middle">20 kΩ</text><polyline points="400,284 400,330" fill="none" stroke="#212121" stroke-width="3"/><polyline points="620,330 212,330" fill="none" stroke="#212121" stroke-width="3"/><circle cx="400" cy="330" r="5" fill="#212121"/><text x="520" y="150" class="s" text-anchor="middle">AO up to 5 V</text><text x="540" y="250" class="s" text-anchor="start">DO: not used (also 5 V logic)</text><text x="210" y="352" class="s" text-anchor="middle"></text><text x="430" y="382" class="s" text-anchor="middle">Divider: 5 V × 20 kΩ / (10 kΩ + 20 kΩ) = 3.33 V   (20 kΩ = two 10 kΩ in series)</text><text x="430.0" y="408" class="s" text-anchor="middle" style="fill:#c62828">Pin numbers are for the ESP32 DevKit 38-pin (ESP32-WROOM-32). Verify against YOUR board's pinout.</text></svg>