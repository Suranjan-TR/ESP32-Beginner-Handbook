<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#111}.t{font-size:18px;font-weight:bold}.s{font-size:13px}.b{font-size:14px;font-weight:bold}.ln{stroke:#333;stroke-width:2;fill:none;marker-end:url(#a)}</style>
<rect width="800" height="380" fill="#fff"/>
<text x="200" y="28" class="t" text-anchor="middle">MICROPROCESSOR SYSTEM</text>
<text x="600" y="28" class="t" text-anchor="middle">MICROCONTROLLER (e.g. ESP32)</text>
<line x1="400" y1="40" x2="400" y2="360" stroke="#999" stroke-dasharray="6"/>
<rect x="150" y="50" width="100" height="60" fill="#ffe0b2" stroke="#333" stroke-width="2"/><text x="200" y="85" class="b" text-anchor="middle">CPU only</text>
<rect x="20" y="200" width="100" height="60" fill="#c8e6c9" stroke="#333" stroke-width="2"/><text x="70" y="235" class="b" text-anchor="middle">RAM chip</text>
<rect x="150" y="200" width="100" height="60" fill="#c8e6c9" stroke="#333" stroke-width="2"/><text x="200" y="235" class="b" text-anchor="middle">Storage chip</text>
<rect x="280" y="200" width="100" height="60" fill="#bbdefb" stroke="#333" stroke-width="2"/><text x="330" y="235" class="b" text-anchor="middle">I/O chip</text>
<line x1="20" y1="160" x2="380" y2="160" stroke="#333" stroke-width="4"/><text x="200" y="152" class="s" text-anchor="middle">BUS (wires connecting separate chips)</text>
<line x1="200" y1="110" x2="200" y2="160" stroke="#333" stroke-width="2"/>
<line x1="70" y1="160" x2="70" y2="200" stroke="#333" stroke-width="2"/><line x1="200" y1="160" x2="200" y2="200" stroke="#333" stroke-width="2"/><line x1="330" y1="160" x2="330" y2="200" stroke="#333" stroke-width="2"/>
<text x="200" y="300" class="s" text-anchor="middle">Many separate chips on a bigger board</text>
<text x="200" y="320" class="s" text-anchor="middle">Used in: laptops, phones</text>
<rect x="450" y="55" width="300" height="230" rx="10" fill="#fff8e1" stroke="#333" stroke-width="3"/>
<text x="600" y="80" class="s" text-anchor="middle">ONE CHIP</text>
<rect x="470" y="95" width="120" height="50" fill="#ffe0b2" stroke="#333" stroke-width="2"/><text x="530" y="126" class="b" text-anchor="middle">CPU</text>
<rect x="610" y="95" width="120" height="50" fill="#c8e6c9" stroke="#333" stroke-width="2"/><text x="670" y="126" class="b" text-anchor="middle">RAM</text>
<rect x="470" y="160" width="120" height="50" fill="#c8e6c9" stroke="#333" stroke-width="2"/><text x="530" y="191" class="b" text-anchor="middle">Flash access</text>
<rect x="610" y="160" width="120" height="50" fill="#bbdefb" stroke="#333" stroke-width="2"/><text x="670" y="191" class="b" text-anchor="middle">GPIO pins</text>
<rect x="470" y="225" width="260" height="40" fill="#e1bee7" stroke="#333" stroke-width="2"/><text x="600" y="250" class="b" text-anchor="middle">ADC · PWM · UART · I2C · SPI</text>
<text x="600" y="310" class="s" text-anchor="middle">Everything inside one chip</text>
<text x="600" y="330" class="s" text-anchor="middle">Used in: washing machine, ESP32 projects</text>
</svg>
