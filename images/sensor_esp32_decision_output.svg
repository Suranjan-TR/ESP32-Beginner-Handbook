<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#111}.t{font-size:18px;font-weight:bold}.s{font-size:13px}.b{font-size:14px;font-weight:bold}</style><rect width="900" height="300" fill="#fff"/><text x="450.0" y="28" class="t" text-anchor="middle">SENSOR → ESP32 → DECISION → OUTPUT</text><rect x="20" y="90" width="170" height="80" rx="8" fill="#bbdefb" stroke="#333" stroke-width="2"/><text x="105.0" y="128.0" class="b" text-anchor="middle">SENSOR</text><text x="105.0" y="146.0" class="s" text-anchor="middle">LDR, HC-SR04, DHT11…</text><rect x="240" y="90" width="170" height="80" rx="8" fill="#ffe0b2" stroke="#333" stroke-width="2"/><text x="325.0" y="128.0" class="b" text-anchor="middle">ESP32 INPUT</text><text x="325.0" y="146.0" class="s" text-anchor="middle">digitalRead / analogRead / pulseIn</text><polygon points="560,70 680,130 560,190 440,130" fill="#e1bee7" stroke="#333" stroke-width="2"/><text x="560" y="126" class="b" text-anchor="middle">DECISION</text><text x="560" y="144" class="s" text-anchor="middle">value vs threshold?</text><rect x="720" y="90" width="160" height="80" rx="8" fill="#c8e6c9" stroke="#333" stroke-width="2"/><text x="800.0" y="128.0" class="b" text-anchor="middle">OUTPUT</text><text x="800.0" y="146.0" class="s" text-anchor="middle">LED / buzzer / Serial</text><polyline points="190,130 238,130" fill="none" stroke="#212121" stroke-width="3" marker-end="url(#a)"/><polyline points="410,130 438,130" fill="none" stroke="#212121" stroke-width="3" marker-end="url(#a)"/><polyline points="680,130 718,130" fill="none" stroke="#212121" stroke-width="3" marker-end="url(#a)"/><text x="700" y="120" class="s" text-anchor="middle">YES</text><text x="560" y="215" class="s" text-anchor="middle">NO → do nothing / turn output OFF</text><text x="450" y="265" class="s" text-anchor="middle">Example: LDR → ADC value → "value &lt; threshold?" → LED ON</text><text x="450.0" y="288" class="s" text-anchor="middle" style="fill:#c62828">SENSE → PROCESS → ACT</text></svg>