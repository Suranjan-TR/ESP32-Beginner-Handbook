<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480" width="820" height="480"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#111}.t{font-size:18px;font-weight:bold}.s{font-size:13px}.b{font-size:14px;font-weight:bold}.ln{stroke:#333;stroke-width:2;fill:none;marker-end:url(#a)}</style>
<rect width="820" height="480" fill="#fff"/>
<text x="410" y="28" class="t" text-anchor="middle">WHAT A GPIO PIN CAN DO (3.3 V logic)</text>
<rect x="30" y="60" width="200" height="380" rx="10" fill="#fff8e1" stroke="#333" stroke-width="3"/><text x="130" y="90" class="b" text-anchor="middle">ESP32 chip</text><text x="130" y="110" class="s" text-anchor="middle">program chooses mode</text>
<g class="s">
<line x1="230" y1="140" x2="420" y2="140" class="ln"/><text x="130" y="145" text-anchor="middle">GPIO 26 (OUTPUT)</text>
<rect x="430" y="115" width="360" height="50" fill="#c8e6c9" stroke="#333"/><text x="610" y="136" class="b" text-anchor="middle">OUTPUT: drives 3.3 V / 0 V</text><text x="610" y="154" text-anchor="middle">LED, buzzer (via resistor / driver)</text>
<line x1="420" y1="215" x2="230" y2="215" class="ln"/><text x="130" y="220" text-anchor="middle">GPIO 27 (INPUT)</text>
<rect x="430" y="190" width="360" height="50" fill="#bbdefb" stroke="#333"/><text x="610" y="211" class="b" text-anchor="middle">INPUT: reads HIGH or LOW</text><text x="610" y="229" text-anchor="middle">push button, digital sensor</text>
<line x1="420" y1="290" x2="230" y2="290" class="ln"/><text x="130" y="295" text-anchor="middle">GPIO 34 (ADC1)</text>
<rect x="430" y="265" width="360" height="50" fill="#ffe0b2" stroke="#333"/><text x="610" y="286" class="b" text-anchor="middle">ADC: measures 0 – 3.3 V → 0 – 4095</text><text x="610" y="304" text-anchor="middle">LDR divider, MQ-2 AO (via divider)</text>
<line x1="230" y1="365" x2="420" y2="365" class="ln"/><text x="130" y="370" text-anchor="middle">GPIO (PWM)</text>
<rect x="430" y="340" width="360" height="50" fill="#e1bee7" stroke="#333"/><text x="610" y="361" class="b" text-anchor="middle">PWM: fast ON/OFF → dimming</text><text x="610" y="379" text-anchor="middle">LED brightness, motor speed</text>
<text x="130" y="425" text-anchor="middle">Also: UART / I2C / SPI pins</text>
</g>
<text x="410" y="465" class="s" text-anchor="middle" font-weight="bold" fill="#c62828" style="fill:#c62828">NEVER apply 5 V directly to a GPIO pin</text>
</svg>
