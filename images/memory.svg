<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#111}.t{font-size:18px;font-weight:bold}.s{font-size:13px}.b{font-size:14px;font-weight:bold}.ln{stroke:#333;stroke-width:2;fill:none;marker-end:url(#a)}</style>
<rect width="800" height="400" fill="#fff"/>
<text x="400" y="28" class="t" text-anchor="middle">ESP32 MEMORY MODEL</text>
<rect x="20" y="60" width="150" height="90" fill="#bbdefb" stroke="#333" stroke-width="2"/><text x="95" y="95" class="b" text-anchor="middle">LAPTOP</text><text x="95" y="115" class="s" text-anchor="middle">Arduino IDE</text><text x="95" y="132" class="s" text-anchor="middle">(firmware file)</text>
<line x1="170" y1="105" x2="255" y2="105" class="ln"/><text x="212" y="95" class="s" text-anchor="middle">USB upload</text>
<rect x="260" y="50" width="520" height="320" rx="10" fill="#fafafa" stroke="#333" stroke-width="3"/><text x="520" y="75" class="b" text-anchor="middle">ESP32 BOARD</text>
<rect x="290" y="95" width="220" height="60" fill="#ffe0b2" stroke="#333" stroke-width="2"/><text x="400" y="130" class="b" text-anchor="middle">CPU (runs instructions)</text>
<rect x="290" y="210" width="220" height="130" fill="#ffcdd2" stroke="#333" stroke-width="2"/><text x="400" y="235" class="b" text-anchor="middle">RAM  (VOLATILE)</text><text x="400" y="258" class="s" text-anchor="middle">Temporary working table</text><text x="400" y="278" class="s" text-anchor="middle">Variables: count, sensorValue</text><text x="400" y="298" class="s" text-anchor="middle">Erased when power is removed</text>
<rect x="550" y="210" width="210" height="130" fill="#c8e6c9" stroke="#333" stroke-width="2"/><text x="655" y="235" class="b" text-anchor="middle">FLASH (NON-VOLATILE)</text><text x="655" y="258" class="s" text-anchor="middle">Notebook with the program</text><text x="655" y="278" class="s" text-anchor="middle">Kept without power</text><text x="655" y="298" class="s" text-anchor="middle">Replaced on new upload</text>
<line x1="655" y1="210" x2="655" y2="120" class="ln"/><line x1="655" y1="120" x2="515" y2="120" class="ln"/><text x="600" y="150" class="s" text-anchor="middle">1) Program read</text><text x="600" y="167" class="s" text-anchor="middle">at power-up</text>
<line x1="400" y1="155" x2="400" y2="208" class="ln"/><text x="470" y="185" class="s" text-anchor="middle">2) CPU reads/writes variables</text>
</svg>
