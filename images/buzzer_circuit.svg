<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" width="860" height="330"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#111}.t{font-size:18px;font-weight:bold}.s{font-size:13px}.b{font-size:14px;font-weight:bold}</style><rect width="860" height="330" fill="#fff"/><text x="430.0" y="28" class="t" text-anchor="middle">ACTIVE BUZZER CONNECTION (GPIO25)</text><rect x="30" y="50" width="180" height="240" rx="8" fill="#e8f5e9" stroke="#333" stroke-width="3"/><text x="120" y="42" class="b" text-anchor="middle">ESP32 DevKit (38-pin)</text><text x="200" y="115" class="b" text-anchor="end">GPIO25</text><circle cx="210" cy="110" r="5" fill="#212121"/><text x="200" y="245" class="b" text-anchor="end">GND</text><circle cx="210" cy="240" r="5" fill="#212121"/><polyline points="210,110 430,110" fill="none" stroke="#1565c0" stroke-width="3" marker-end="url(#a)"/><rect x="430" y="88" width="150" height="44" rx="6" fill="#fff9c4" stroke="#333" stroke-width="2"/><text x="505" y="115" class="b" text-anchor="middle">Active buzzer</text><text x="432" y="80" class="s" text-anchor="start">+ (marked / long leg)</text><text x="580" y="80" class="s" text-anchor="end">− terminal</text><polyline points="580,110 680,110 680,240 212,240" fill="none" stroke="#212121" stroke-width="3" marker-end="url(#a)"/><text x="430" y="232" class="s" text-anchor="middle">GND (0 V)</text><text x="430" y="275" class="s" text-anchor="middle">HIGH = beep, LOW = silent. If the buzzer draws more than ~10-12 mA, drive it through an NPN transistor.</text><text x="430.0" y="318" class="s" text-anchor="middle" style="fill:#c62828">Pin numbers are for the ESP32 DevKit 38-pin (ESP32-WROOM-32). Verify against YOUR board's pinout.</text></svg>