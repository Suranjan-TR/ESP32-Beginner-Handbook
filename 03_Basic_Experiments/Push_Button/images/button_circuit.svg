<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" width="860" height="330"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#111}.t{font-size:18px;font-weight:bold}.s{font-size:13px}.b{font-size:14px;font-weight:bold}</style><rect width="860" height="330" fill="#fff"/><text x="430.0" y="28" class="t" text-anchor="middle">PUSH BUTTON CONNECTION (GPIO27, INPUT_PULLUP)</text><rect x="30" y="50" width="180" height="240" rx="8" fill="#e8f5e9" stroke="#333" stroke-width="3"/><text x="120" y="42" class="b" text-anchor="middle">ESP32 DevKit (38-pin)</text><text x="200" y="115" class="b" text-anchor="end">GPIO27</text><circle cx="210" cy="110" r="5" fill="#212121"/><text x="200" y="245" class="b" text-anchor="end">GND</text><circle cx="210" cy="240" r="5" fill="#212121"/><text x="120" y="150" class="s" text-anchor="middle">INPUT_PULLUP turns on an</text><text x="120" y="166" class="s" text-anchor="middle">internal resistor to 3.3 V</text><text x="120" y="182" class="s" text-anchor="middle">(released → HIGH)</text><polyline points="210,110 470,110" fill="none" stroke="#1565c0" stroke-width="3"/><rect x="470" y="88" width="120" height="44" rx="6" fill="#e1bee7" stroke="#333" stroke-width="2"/><text x="530" y="115" class="b" text-anchor="middle">Push button</text><polyline points="590,110 680,110 680,240 212,240" fill="none" stroke="#212121" stroke-width="3"/><text x="430" y="232" class="s" text-anchor="middle">GND (0 V)</text><text x="430" y="275" class="s" text-anchor="middle">Released: pin sees 3.3 V via pull-up → HIGH.   Pressed: pin connected to GND → LOW.</text><text x="430.0" y="318" class="s" text-anchor="middle" style="fill:#c62828">Pin numbers are for the ESP32 DevKit 38-pin (ESP32-WROOM-32). Verify against YOUR board's pinout.</text></svg>